<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS 블로그 관리 대시보드</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex">

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <div class="flex-1 p-12">
        <h1 class="text-3xl font-bold mb-10">Dashboard</h1>

        <!-- 통계 -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-6 mb-8">
            <div class="card p-6 rounded-lg shadow">
                <h2 class="text-muted text-sm font-medium mb-2">총 게시물</h2>
                <p id="total-posts" class="text-3xl font-bold">0</p>
            </div>
            <div class="card p-6 rounded-lg shadow">
                <h2 class="text-muted text-sm font-medium mb-2">발행된 게시물</h2>
                <p id="published-posts" class="text-3xl font-bold">0</p>
            </div>
            <div class="card p-6 rounded-lg shadow">
                <h2 class="text-muted text-sm font-medium mb-2">총 조회수</h2>
                <p id="total-views" class="text-3xl font-bold">0</p>
            </div>
            <div class="card p-6 rounded-lg shadow">
                <h2 class="text-muted text-sm font-medium mb-2">총 카테고리</h2>
                <p id="total-categories" class="text-3xl font-bold">0</p>
            </div>
            <div class="card p-6 rounded-lg shadow">
                <h2 class="text-muted text-sm font-medium mb-2">총 댓글</h2>
                <p id="total-comments" class="text-3xl font-bold">0</p>
            </div>
        </div>

        <!-- 최근 게시물 -->
        <div class="card p-6 rounded-lg shadow mb-8">
            <h2 class="text-xl font-bold mb-4">최근 게시물</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr>
                            <th class="p-4">제목</th>
                            <th class="p-4">카테고리</th>
                            <th class="p-4">작성일</th>
                            <th class="p-4">조회수</th>
                            <th class="p-4"></th>
                        </tr>
                    </thead>
                    <tbody id="posts-list">
                        <!-- 동적 생성 -->
                    </tbody>
                </table>
            </div>
            <div id="pagination" class="mt-4 flex justify-center"></div>
        </div>
        
        <!-- 카테고리 -->
        <div class="card p-6 rounded-lg shadow">
             <h2 class="text-xl font-bold mb-4">카테고리</h2>
             <div id="categories-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- 동적 생성 -->
             </div>
        </div>

    </div>
    
    <script src="aws_blog_data_system.js"></script>
    <script src="app.js"></script>
    <script>
        loadLayoutAndInit(blogData => {
            blogData.updateStatistics();
            blogData.updatePostsList();
            blogData.updateCategories();
        });
    </script>
</body>
</html>
