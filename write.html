<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 글 작성</title>
    <!-- Toast UI Editor CSS -->
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex">

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <div class="flex-1 p-12">
        <h1 class="text-3xl font-bold mb-10">New Post</h1>

        <form id="post-form" class="space-y-6">
            <div>
                <label for="title" class="block text-sm font-medium text-gray-700">Title</label>
                <input type="text" id="title" name="title" required
                       class="form-input mt-1 block w-full rounded-md shadow-sm">
            </div>

            <div>
                <label for="content" class="block text-sm font-medium text-gray-700">Content</label>
                <!-- Toast UI Editor가 마운트될 div -->
                <div id="editor" class="mt-1"></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="category" class="block text-sm font-medium text-gray-700">Category</label>
                    <select id="category" name="category" required
                            class="form-select mt-1 block w-full rounded-md shadow-sm">
                        <!-- 카테고리 옵션을 동적으로 여기에 삽입 -->
                    </select>
                </div>
                <div>
                    <label for="tags" class="block text-sm font-medium text-gray-700">Tags (comma-separated)</label>
                    <input type="text" id="tags" name="tags"
                           class="form-input mt-1 block w-full rounded-md shadow-sm">
                </div>
            </div>

            <div class="flex justify-end">
                <button type="submit" class="btn btn-primary">
                    Save Post
                </button>
            </div>
        </form>
    </div>

    <script src="aws_blog_data_system.js"></script>
    <script src="app.js"></script>
    <!-- Toast UI Editor JS -->
    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
    <script>
        let editor; // editor 인스턴스를 전역적으로 접근 가능하게 선언

        loadLayoutAndInit(blogData => {
            // Toast UI Editor 초기화
            editor = new toastui.Editor({
                el: document.querySelector('#editor'),
                height: '500px',
                initialEditType: 'markdown',
                previewStyle: 'vertical'
            });

            const categorySelect = document.getElementById('category');
            if (blogData && blogData.categories) {
                blogData.categories.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category.id;
                    option.textContent = category.name;
                    categorySelect.appendChild(option);
                });
            }

            const form = document.getElementById('post-form');
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const formData = new FormData(form);
                const postData = {
                    title: formData.get('title'),
                    // 에디터의 내용을 Markdown으로 가져옴
                    content: editor.getMarkdown(),
                    categoryId: parseInt(formData.get('category')),
                    tags: formData.get('tags').split(',').map(tag => tag.trim()),
                    status: 'published'
                };

                blogData.addPost(postData);
                showToast('게시물이 성공적으로 저장되었습니다.');
                setTimeout(() => {
                    window.location.href = 'posts.html';
                }, 1000); // 1초 후 페이지 이동
            });
        });
    </script>
</body>
</html>
