<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시물 관리</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #ffffff; /* 흰색 배경 */
            color: #000000; /* 검은색 텍스트 */
        }
        .sidebar {
            background-color: #f3f4f6; /* 밝은 회색 사이드바 */
            color: #000000;
        }
        .card {
            background-color: #f9fafb; /* 매우 밝은 회색 카드 */
            border: 1px solid #e5e7eb; /* 회색 테두리 */
        }
    </style>
</head>
<body class="flex">

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <div class="flex-1 p-8">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold">게시물 관리</h1>
            <a href="write.html" class="bg-black hover:bg-gray-800 text-white font-bold py-2 px-4 rounded-lg">새 글 작성</a>
        </div>

        <!-- Posts Table -->
        <div class="card p-6 rounded-lg shadow-lg">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr>
                            <th class="p-4">제목</th>
                            <th class="p-4">카테고리</th>
                            <th class="p-4">작성일</th>
                            <th class="p-4">조회수</th>
                            <th class="p-4">상태</th>
                            <th class="p-4"></th>
                        </tr>
                    </thead>
                    <tbody id="posts-list">
                        <!-- 동적으로 포스트 목록을 여기에 삽입 -->
                    </tbody>
                </table>
            </div>
            <div id="pagination" class="mt-4 flex justify-center"></div>
        </div>
    </div>

    <script src="aws_blog_data_system.js"></script>
    <script src="app.js"></script>
    <script>
        loadLayoutAndInit(blogData => {
            blogData.updatePostsList();
        });
    </script>
</body>
</html>
